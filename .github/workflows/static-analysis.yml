name: Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML & CSS Markup
        run: |
          npx -y htmlhint index.html
          echo '{"rules": {"property-no-unknown": true}}' > .stylelintrc.json
          npx -y stylelint style.css
